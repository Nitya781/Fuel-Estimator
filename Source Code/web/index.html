<!DOCTYPE html>
<html>
<head>
    <title>HAL Fuel Estimation System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>HAL Fuel Estimation System</h1>

    <div class="dashboard">

        <div class="card">
            <h3>Fuel Remaining</h3>
            <p id="fuel">2531 kg</p>
        </div>

        <div class="card">
            <h3>Fuel Flow</h3>
            <p id="flow">6362 kg/hr</p>
        </div>

        <div class="card">
            <h3>SFC</h3>
            <p id="sfc">1.002</p>
        </div>


        <div class="card">
            <h3>Endurance</h3>
            <p id="endurance">0.40 hr</p>
        </div>

        <div class="card">
            <h3>Range</h3>
            <p id="range">167 NM</p>
        </div>

        <div class="card">
            <h3>Fuel at Landing</h3>
            <p id="landing">1850 kg</p>
        </div>


        <div class="card">
            <h3>Reserve Fuel</h3>
            <p id="reserve">500 kg</p>
        </div>

        <div class="card">
            <h3>Bingo Fuel</h3>
            <p id="bingo">1482 kg</p>
        </div>

    </div>


    <div class="status">
        STATUS:
        <span id="status">NORMAL</span>
    </div>


</div>


<script src="app.js"></script>

</body>
</html>
